<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>PCB S&OP — Query Runner</title>
  <style>
    :root {
      --navy:    #1e3a5f;
      --blue:    #2563eb;
      --green:   #16a34a;
      --red:     #dc2626;
      --amber:   #d97706;
      --bg:      #f1f5f9;
      --surface: #ffffff;
      --border:  #e2e8f0;
      --text:    #1e293b;
      --muted:   #64748b;
      --code-bg: #0f172a;
      --code-fg: #e2e8f0;
    }
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: var(--bg); color: var(--text); height: 100vh; display: flex; flex-direction: column; }

    /* ── Header ── */
    header {
      background: var(--navy); color: #fff;
      height: 52px; padding: 0 1.5rem;
      display: flex; align-items: center; justify-content: space-between;
      flex-shrink: 0;
    }
    .hdr-left  { display: flex; align-items: baseline; gap: .75rem; }
    .hdr-brand { font-size: .95rem; font-weight: 700; }
    .hdr-sub   { font-size: .68rem; opacity: .6; text-transform: uppercase; letter-spacing: .08em; }
    .hdr-nav a {
      color: #93c5fd; font-size: .78rem; text-decoration: none; margin-left: 1.25rem;
    }
    .hdr-nav a:hover { color: #fff; }

    /* ── Layout ── */
    .workspace {
      flex: 1; display: grid;
      grid-template-columns: 280px 1fr;
      grid-template-rows: 1fr;
      overflow: hidden;
    }

    /* ── Sidebar: saved queries ── */
    .sidebar {
      background: var(--surface); border-right: 1px solid var(--border);
      display: flex; flex-direction: column; overflow: hidden;
    }
    .sidebar-header {
      padding: .75rem 1rem;
      font-size: .68rem; font-weight: 700; letter-spacing: .1em;
      text-transform: uppercase; color: var(--muted);
      border-bottom: 1px solid var(--border); flex-shrink: 0;
    }
    .query-list { overflow-y: auto; flex: 1; }
    .qitem {
      padding: .65rem 1rem; border-bottom: 1px solid var(--border);
      cursor: pointer; transition: background .1s;
    }
    .qitem:hover { background: #f8fafc; }
    .qitem.active { background: #eff6ff; border-left: 3px solid var(--blue); }
    .qitem-name { font-size: .8rem; font-weight: 600; margin-bottom: .2rem; }
    .qitem-desc { font-size: .7rem; color: var(--muted); line-height: 1.4; }

    /* ── Main pane ── */
    .main { display: flex; flex-direction: column; overflow: hidden; }

    /* Editor */
    .editor-area {
      padding: 1rem 1.25rem .75rem;
      border-bottom: 1px solid var(--border);
      background: var(--surface); flex-shrink: 0;
    }
    .editor-toolbar {
      display: flex; align-items: center; justify-content: space-between;
      margin-bottom: .6rem;
    }
    .editor-label {
      font-size: .68rem; font-weight: 700; letter-spacing: .1em;
      text-transform: uppercase; color: var(--muted);
    }
    .toolbar-right { display: flex; align-items: center; gap: .6rem; }
    .hint { font-size: .7rem; color: var(--muted); }
    .btn-run {
      background: var(--blue); color: #fff;
      border: none; border-radius: 6px;
      padding: .45rem 1.1rem; font-size: .82rem; font-weight: 600;
      cursor: pointer; display: flex; align-items: center; gap: .4rem;
    }
    .btn-run:hover { background: #1d4ed8; }
    .btn-run:disabled { background: var(--muted); cursor: not-allowed; }
    .btn-clear {
      background: none; border: 1px solid var(--border); border-radius: 6px;
      padding: .4rem .75rem; font-size: .78rem; color: var(--muted); cursor: pointer;
    }
    .btn-clear:hover { border-color: var(--red); color: var(--red); }

    textarea#sqlInput {
      width: 100%; height: 160px;
      font-family: 'SF Mono', 'Fira Code', 'Courier New', monospace;
      font-size: .82rem; line-height: 1.6;
      background: var(--code-bg); color: var(--code-fg);
      border: 1px solid #334155; border-radius: 6px;
      padding: .75rem 1rem; resize: vertical;
      outline: none; tab-size: 2;
    }
    textarea#sqlInput:focus { border-color: var(--blue); }

    /* Results */
    .results-area { flex: 1; overflow: auto; padding: 1rem 1.25rem; }
    .result-bar {
      display: flex; align-items: center; justify-content: space-between;
      margin-bottom: .75rem;
    }
    .result-meta { font-size: .75rem; color: var(--muted); }
    .result-meta strong { color: var(--text); }

    .result-error {
      background: #fff5f5; border: 1px solid #fca5a5; border-radius: 8px;
      padding: 1rem 1.25rem; font-family: monospace; font-size: .82rem;
      color: var(--red); white-space: pre-wrap;
    }
    .result-empty {
      color: var(--muted); font-size: .85rem; padding: 1.5rem 0;
    }

    .result-table-wrap { overflow-x: auto; }
    table { width: 100%; border-collapse: collapse; font-size: .79rem; white-space: nowrap; }
    th {
      background: #f8fafc; padding: .5rem .85rem;
      text-align: left; font-size: .66rem; text-transform: uppercase;
      letter-spacing: .08em; color: var(--muted); font-weight: 600;
      border-bottom: 2px solid var(--border); position: sticky; top: 0;
    }
    td { padding: .5rem .85rem; border-bottom: 1px solid var(--border); font-family: 'SF Mono', 'Courier New', monospace; }
    tr:last-child td { border-bottom: none; }
    tr:hover td { background: #f8fafc; }
    td.null { color: #94a3b8; font-style: italic; }
    td.num  { text-align: right; }

    /* Status bar */
    .status-bar {
      height: 26px; background: #1e293b; color: #94a3b8;
      padding: 0 1.25rem; display: flex; align-items: center; gap: 1rem;
      font-size: .68rem; font-family: monospace; flex-shrink: 0;
    }
    .status-bar .ok   { color: #4ade80; }
    .status-bar .err  { color: #f87171; }
    .status-bar .spin { animation: spin .7s linear infinite; display: inline-block; }
    @keyframes spin { to { transform: rotate(360deg); } }

    .placeholder-msg {
      color: var(--muted); font-size: .85rem; padding: 2rem 0; text-align: center;
    }
  </style>
</head>
<body>

<header>
  <div class="hdr-left">
    <span class="hdr-brand">Post Consumer Brands</span>
    <span class="hdr-sub">S&amp;OP Query Runner &mdash; sop.db</span>
  </div>
  <nav class="hdr-nav">
    <a href="/sop">&#8592; Dashboard</a>
  </nav>
</header>

<div class="workspace">

  <!-- Sidebar: reference queries from sop_practice.sql -->
  <aside class="sidebar">
    <div class="sidebar-header">Reference Queries</div>
    <div class="query-list" id="queryList"></div>
  </aside>

  <!-- Main editor + results -->
  <div class="main">

    <div class="editor-area">
      <div class="editor-toolbar">
        <span class="editor-label">SQL &mdash; SELECT only &mdash; sop.db</span>
        <div class="toolbar-right">
          <span class="hint" id="hintText">⌘ + Enter to run</span>
          <button class="btn-clear" id="btnClear">Clear</button>
          <button class="btn-run" id="btnRun">&#9654; Run</button>
        </div>
      </div>
      <textarea id="sqlInput" spellcheck="false" placeholder="SELECT * FROM products;"></textarea>
    </div>

    <div class="results-area" id="resultsArea">
      <div class="placeholder-msg">Results will appear here.</div>
    </div>

    <div class="status-bar" id="statusBar">
      <span id="statusText">Ready</span>
    </div>

  </div>
</div>

<script>
// ── Reference queries ────────────────────────────────────────────────────────
const QUERIES = [
  {
    name: '1a. Forecast Accuracy by SKU',
    desc: 'MAPE % and bias — all 6 months',
    sql: `SELECT
  p.sku, p.brand,
  SUM(f.forecast_qty)                                               AS total_forecast,
  SUM(f.actual_qty)                                                 AS total_actual,
  SUM(f.forecast_qty) - SUM(f.actual_qty)                           AS volume_bias,
  ROUND(100.0*(SUM(f.forecast_qty)-SUM(f.actual_qty))
        /SUM(f.actual_qty), 1)                                      AS bias_pct,
  ROUND(100.0*AVG(ABS(f.forecast_qty-f.actual_qty)/f.actual_qty),1) AS mape_pct
FROM forecast_vs_actuals f
JOIN products p ON p.product_id = f.product_id
GROUP BY p.product_id, p.sku, p.brand
ORDER BY mape_pct DESC`,
  },
  {
    name: '1b. Promo vs Non-Promo MAPE — Pebbles',
    desc: 'How much worse is forecast during promos?',
    sql: `SELECT
  p.sku,
  f.promo_flag,
  COUNT(*)                                                          AS periods,
  ROUND(AVG(ABS(f.forecast_qty-f.actual_qty)/f.actual_qty)*100, 1) AS avg_mape_pct,
  ROUND(AVG((f.forecast_qty-f.actual_qty)/f.actual_qty)*100, 1)    AS avg_bias_pct
FROM forecast_vs_actuals f
JOIN products p ON p.product_id = f.product_id
WHERE p.brand = 'PEBBLES'
GROUP BY p.product_id, p.sku, f.promo_flag
ORDER BY p.sku, f.promo_flag`,
  },
  {
    name: '1c. Monthly Trend — Raisin Bran',
    desc: 'Did forecast accuracy improve after the Jan spike?',
    sql: `SELECT
  f.period_key,
  f.promo_flag,
  f.forecast_qty,
  f.actual_qty,
  f.actual_qty - f.forecast_qty                                     AS error_cases,
  ROUND(100.0*(f.actual_qty-f.forecast_qty)/f.forecast_qty, 1)     AS pct_error
FROM forecast_vs_actuals f
JOIN products p ON p.product_id = f.product_id
WHERE p.sku = 'RB-20OZ'
ORDER BY f.period_key`,
  },
  {
    name: '2a. Weeks of Supply + ATP (Apr 2026)',
    desc: 'Inventory health snapshot — target 3–8 WOS',
    sql: `WITH avg_weekly AS (
  SELECT product_id, AVG(actual_qty)/4.33 AS wkly
  FROM forecast_vs_actuals WHERE period_key >= '2026-01'
  GROUP BY product_id
)
SELECT
  p.sku, p.brand, p.plant,
  i.qty_on_hand,
  ROUND(d.wkly, 0)                                                  AS avg_weekly_demand,
  ROUND(i.qty_on_hand / d.wkly, 1)                                  AS wos,
  ROUND(i.qty_on_hand + i.qty_on_order - i.qty_committed, 0)        AS atp,
  CASE
    WHEN i.qty_on_hand/d.wkly < 2 THEN 'CRITICAL'
    WHEN i.qty_on_hand/d.wkly < 3 THEN 'RISK'
    WHEN i.qty_on_hand/d.wkly > 8 THEN 'EXCESS'
    ELSE 'OK'
  END AS status
FROM inventory_snapshots i
JOIN products p    ON p.product_id = i.product_id
JOIN avg_weekly d  ON d.product_id = i.product_id
WHERE i.period_key = '2026-04'
ORDER BY wos ASC`,
  },
  {
    name: '2b. Pebbles Inventory Trend',
    desc: 'WOS across all snapshot periods',
    sql: `WITH avg_weekly AS (
  SELECT product_id, AVG(actual_qty)/4.33 AS wkly
  FROM forecast_vs_actuals WHERE period_key >= '2026-01'
  GROUP BY product_id
)
SELECT
  i.period_key,
  p.sku,
  i.qty_on_hand,
  ROUND(i.qty_on_hand / d.wkly, 1) AS wos
FROM inventory_snapshots i
JOIN products p    ON p.product_id = i.product_id
JOIN avg_weekly d  ON d.product_id = i.product_id
WHERE p.brand = 'PEBBLES'
ORDER BY p.sku, i.period_key`,
  },
  {
    name: '3a. OTIF by Customer',
    desc: 'On-Time In-Full % — shipped orders only',
    sql: `SELECT
  c.name AS customer, c.tier,
  COUNT(*) AS total_orders,
  SUM(CASE WHEN confirmed_date <= requested_date
           AND shipped_qty = ordered_qty THEN 1 ELSE 0 END) AS otif_count,
  SUM(CASE WHEN confirmed_date > requested_date THEN 1 ELSE 0 END) AS late_count,
  SUM(CASE WHEN shipped_qty < ordered_qty THEN 1 ELSE 0 END)       AS short_count,
  ROUND(100.0*SUM(CASE WHEN confirmed_date<=requested_date
    AND shipped_qty=ordered_qty THEN 1 ELSE 0 END)/COUNT(*), 1)    AS otif_pct,
  ROUND(100.0*SUM(shipped_qty)/SUM(ordered_qty), 1)                AS fill_rate_pct
FROM sales_orders so
JOIN customers c ON c.customer_id = so.customer_id
WHERE so.status = 'shipped'
GROUP BY c.customer_id, c.name, c.tier
ORDER BY otif_pct ASC`,
  },
  {
    name: '3b. OTIF by SKU',
    desc: 'Which products are driving service failures?',
    sql: `SELECT
  p.sku, p.brand,
  COUNT(*) AS shipped_orders,
  ROUND(100.0*SUM(CASE WHEN confirmed_date<=requested_date
    AND shipped_qty=ordered_qty THEN 1 ELSE 0 END)/COUNT(*), 1)    AS otif_pct,
  ROUND(100.0*SUM(shipped_qty)/SUM(ordered_qty), 1)                AS fill_rate_pct,
  SUM(ordered_qty - COALESCE(shipped_qty, 0))                      AS total_cases_short
FROM sales_orders so
JOIN products p ON p.product_id = so.product_id
WHERE so.status = 'shipped'
GROUP BY p.product_id, p.sku, p.brand
ORDER BY otif_pct ASC`,
  },
  {
    name: '4a. Supplier On-Time Delivery',
    desc: 'Actual OTD vs stated reliability',
    sql: `SELECT
  s.name AS supplier, s.category,
  s.reliability_pct AS stated_otd_pct,
  COUNT(*) AS pos_received,
  SUM(CASE WHEN received_date <= expected_date THEN 1 ELSE 0 END) AS on_time,
  ROUND(100.0*SUM(CASE WHEN received_date<=expected_date
    THEN 1 ELSE 0 END)/COUNT(*), 1)                                AS actual_otd_pct,
  ROUND(AVG(julianday(received_date)-julianday(expected_date)),1)  AS avg_days_deviation
FROM purchase_orders po
JOIN suppliers s ON s.supplier_id = po.supplier_id
WHERE po.status = 'received'
GROUP BY s.supplier_id, s.name, s.category, s.reliability_pct
ORDER BY actual_otd_pct ASC`,
  },
  {
    name: '4b. Open Supply vs Open Demand',
    desc: 'Inbound POs minus open SOs — supply gap',
    sql: `WITH os AS (
  SELECT product_id, SUM(qty) AS inbound
  FROM purchase_orders WHERE status='open' GROUP BY product_id
),
od AS (
  SELECT product_id, SUM(ordered_qty) AS committed
  FROM sales_orders WHERE status='open' GROUP BY product_id
)
SELECT
  p.sku, p.brand,
  COALESCE(os.inbound, 0)   AS open_supply,
  COALESCE(od.committed, 0) AS open_demand,
  COALESCE(os.inbound,0) - COALESCE(od.committed,0) AS gap,
  CASE
    WHEN COALESCE(os.inbound,0) < COALESCE(od.committed,0)
    THEN 'SHORT'
    ELSE 'COVERED'
  END AS coverage
FROM products p
LEFT JOIN os ON os.product_id = p.product_id
LEFT JOIN od ON od.product_id = p.product_id
ORDER BY gap ASC`,
  },
  {
    name: '5a. 3-Month Rolling Avg Demand',
    desc: 'Smooths promo spikes — Pebbles',
    sql: `SELECT
  f.period_key, p.sku, f.promo_flag,
  f.actual_qty,
  ROUND(AVG(f.actual_qty) OVER (
    PARTITION BY f.product_id ORDER BY f.period_key
    ROWS BETWEEN 2 PRECEDING AND CURRENT ROW
  ), 0) AS rolling_3mo_avg,
  f.actual_qty - ROUND(AVG(f.actual_qty) OVER (
    PARTITION BY f.product_id ORDER BY f.period_key
    ROWS BETWEEN 2 PRECEDING AND CURRENT ROW
  ), 0) AS variance_vs_rolling
FROM forecast_vs_actuals f
JOIN products p ON p.product_id = f.product_id
WHERE p.brand = 'PEBBLES'
ORDER BY p.sku, f.period_key`,
  },
  {
    name: '5b. YTD Revenue vs Plan by Brand',
    desc: 'Cumulative 2026 actuals vs plan',
    sql: `SELECT
  f.period_key, p.brand,
  SUM(f.forecast_rev)                                               AS monthly_plan,
  SUM(f.actual_rev)                                                 AS monthly_actual,
  SUM(SUM(f.forecast_rev)) OVER (PARTITION BY p.brand ORDER BY f.period_key) AS ytd_plan,
  SUM(SUM(f.actual_rev))   OVER (PARTITION BY p.brand ORDER BY f.period_key) AS ytd_actual,
  SUM(SUM(f.actual_rev))   OVER (PARTITION BY p.brand ORDER BY f.period_key)
  - SUM(SUM(f.forecast_rev)) OVER (PARTITION BY p.brand ORDER BY f.period_key) AS ytd_variance
FROM forecast_vs_actuals f
JOIN products p ON p.product_id = f.product_id
WHERE f.period_key >= '2026-01'
GROUP BY p.brand, f.period_key
ORDER BY p.brand, f.period_key`,
  },
  {
    name: '5c. MoM Demand Growth Rate',
    desc: 'Month-over-month % change per SKU',
    sql: `SELECT
  f.period_key, p.sku,
  f.actual_qty,
  LAG(f.actual_qty) OVER (PARTITION BY f.product_id ORDER BY f.period_key) AS prev_mo,
  ROUND(100.0*(f.actual_qty
    - LAG(f.actual_qty) OVER (PARTITION BY f.product_id ORDER BY f.period_key))
    / LAG(f.actual_qty) OVER (PARTITION BY f.product_id ORDER BY f.period_key)
  , 1) AS mom_growth_pct
FROM forecast_vs_actuals f
JOIN products p ON p.product_id = f.product_id
ORDER BY p.sku, f.period_key`,
  },
  {
    name: '6. Executive S&OP Summary',
    desc: 'Full consolidated view — all signals',
    sql: `WITH avg_weekly AS (
  SELECT product_id, AVG(actual_qty)/4.33 AS wkly, AVG(actual_rev) AS mo_rev
  FROM forecast_vs_actuals WHERE period_key >= '2026-01'
  GROUP BY product_id
),
inv AS (SELECT * FROM inventory_snapshots WHERE period_key = '2026-04'),
od  AS (SELECT product_id, SUM(ordered_qty) AS open_so   FROM sales_orders    WHERE status='open'     GROUP BY product_id),
os  AS (SELECT product_id, SUM(qty) AS inbound            FROM purchase_orders WHERE status='open'     GROUP BY product_id)
SELECT
  p.sku, p.brand, p.plant,
  ROUND(d.wkly, 0)                                                  AS weekly_run_rate,
  i.qty_on_hand,
  ROUND(i.qty_on_hand / d.wkly, 1)                                  AS wos,
  ROUND(i.qty_on_hand + COALESCE(os.inbound,0)
    - COALESCE(od.open_so,0), 0)                                    AS projected_atp,
  COALESCE(od.open_so, 0)  AS open_demand,
  COALESCE(os.inbound, 0)  AS inbound_supply,
  ROUND(d.mo_rev, 0)       AS monthly_rev
FROM products p
JOIN inv i         ON i.product_id  = p.product_id
JOIN avg_weekly d  ON d.product_id  = p.product_id
LEFT JOIN od       ON od.product_id = p.product_id
LEFT JOIN os       ON os.product_id = p.product_id
ORDER BY d.mo_rev DESC`,
  },
  {
    name: 'Schema: All Tables',
    desc: 'Inspect table structure in sop.db',
    sql: `SELECT name, sql FROM sqlite_master WHERE type='table' ORDER BY name`,
  },
  {
    name: 'Row Counts',
    desc: 'Quick sanity check — records per table',
    sql: `SELECT 'products'             AS tbl, COUNT(*) AS rows FROM products
UNION ALL SELECT 'customers',           COUNT(*) FROM customers
UNION ALL SELECT 'suppliers',           COUNT(*) FROM suppliers
UNION ALL SELECT 'forecast_vs_actuals', COUNT(*) FROM forecast_vs_actuals
UNION ALL SELECT 'inventory_snapshots', COUNT(*) FROM inventory_snapshots
UNION ALL SELECT 'sales_orders',        COUNT(*) FROM sales_orders
UNION ALL SELECT 'purchase_orders',     COUNT(*) FROM purchase_orders`,
  },
];

// ── Render sidebar ────────────────────────────────────────────────────────────
const list = document.getElementById('queryList');
QUERIES.forEach((q, i) => {
  const el = document.createElement('div');
  el.className = 'qitem';
  el.dataset.index = i;
  el.innerHTML = `<div class="qitem-name">${q.name}</div><div class="qitem-desc">${q.desc}</div>`;
  el.addEventListener('click', () => loadQuery(i));
  list.appendChild(el);
});

let activeIndex = null;
function loadQuery(i) {
  document.querySelectorAll('.qitem').forEach(el => el.classList.remove('active'));
  document.querySelectorAll('.qitem')[i].classList.add('active');
  activeIndex = i;
  document.getElementById('sqlInput').value = QUERIES[i].sql;
  setStatus('ready', `Loaded: ${QUERIES[i].name}`);
}

// ── Run query ─────────────────────────────────────────────────────────────────
const sqlInput  = document.getElementById('sqlInput');
const btnRun    = document.getElementById('btnRun');
const btnClear  = document.getElementById('btnClear');
const results   = document.getElementById('resultsArea');

async function runQuery() {
  const sql = sqlInput.value.trim();
  if (!sql) return;

  btnRun.disabled = true;
  setStatus('loading', '⟳ Running…');
  results.innerHTML = '';

  const t0 = performance.now();
  try {
    const resp = await fetch('/api/sop/query', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ sql }),
    });
    const data = await resp.json();
    const elapsed = (performance.now() - t0).toFixed(0);

    if (!resp.ok) {
      results.innerHTML = `<div class="result-error">${data.error}</div>`;
      setStatus('error', `Error — ${data.error.split('\n')[0]}`);
    } else {
      renderResults(data.rows, data.count, elapsed);
      setStatus('ok', `${data.count} row${data.count !== 1 ? 's' : ''} &nbsp;·&nbsp; ${elapsed}ms`);
    }
  } catch (e) {
    results.innerHTML = `<div class="result-error">${e.message}</div>`;
    setStatus('error', e.message);
  } finally {
    btnRun.disabled = false;
  }
}

function renderResults(rows, count, elapsed) {
  if (!rows.length) {
    results.innerHTML = `<div class="result-empty">Query returned 0 rows.</div>`;
    return;
  }

  const cols = Object.keys(rows[0]);

  // Detect numeric columns
  const numCols = new Set(cols.filter(c =>
    rows.every(r => r[c] === null || r[c] === '' || !isNaN(Number(r[c])))
  ));

  const header = cols.map(c => `<th>${c}</th>`).join('');
  const body = rows.map(row => {
    const cells = cols.map(c => {
      const v = row[c];
      if (v === null || v === undefined) return `<td class="null">NULL</td>`;
      const isNum = numCols.has(c) && v !== '';
      return `<td class="${isNum ? 'num' : ''}">${v}</td>`;
    }).join('');
    return `<tr>${cells}</tr>`;
  }).join('');

  results.innerHTML = `
    <div class="result-bar">
      <span class="result-meta"><strong>${count}</strong> row${count !== 1 ? 's' : ''} &nbsp;·&nbsp; ${elapsed}ms</span>
    </div>
    <div class="result-table-wrap">
      <table><thead><tr>${header}</tr></thead><tbody>${body}</tbody></table>
    </div>`;
}

function setStatus(type, msg) {
  const el = document.getElementById('statusText');
  el.className = type === 'ok' ? 'ok' : type === 'error' ? 'err' : '';
  el.innerHTML = msg;
}

btnRun.addEventListener('click', runQuery);
btnClear.addEventListener('click', () => {
  sqlInput.value = '';
  results.innerHTML = '<div class="placeholder-msg">Results will appear here.</div>';
  setStatus('ready', 'Ready');
  document.querySelectorAll('.qitem').forEach(el => el.classList.remove('active'));
  activeIndex = null;
});

sqlInput.addEventListener('keydown', e => {
  if ((e.metaKey || e.ctrlKey) && e.key === 'Enter') {
    e.preventDefault();
    runQuery();
  }
  // Tab key inserts spaces instead of losing focus
  if (e.key === 'Tab') {
    e.preventDefault();
    const s = sqlInput.selectionStart, end = sqlInput.selectionEnd;
    sqlInput.value = sqlInput.value.substring(0, s) + '  ' + sqlInput.value.substring(end);
    sqlInput.selectionStart = sqlInput.selectionEnd = s + 2;
  }
});

// Load row counts on start as a quick sanity check
loadQuery(QUERIES.length - 1);
runQuery();
</script>
</body>
</html>
