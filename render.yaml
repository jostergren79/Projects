services:
  - type: web
    name: edgar-api
    env: python
    rootDir: edgar-api
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: CORS_ALLOW_ORIGINS
        value: https://www.edgarwolf.com
      - key: SEC_USER_AGENT
        value: edgar-api/0.1 jason@edgarwolf.com
      - key: SEC_REQUIRE_EXPLICIT_USER_AGENT
        value: "true"
      - key: SEC_HTTP_TIMEOUT_SECONDS
        value: "20"
      - key: SEC_HTTP_MAX_RETRIES
        value: "3"
      - key: SEC_HTTP_RETRY_BASE_SECONDS
        value: "0.5"
      - key: APP_URL
        value: https://www.edgarwolf.com
      - key: STRIPE_PRO_PRICE_ID
        value: price_1TVNfH1C3cijZqBOyp7Y5qJH
      - key: STRIPE_PRO_PLUS_PRICE_ID
        value: price_1TVNeQ1C3cijZqBOkOX1IoJj
      - key: STRIPE_SECRET_KEY
        sync: false
      - key: STRIPE_WEBHOOK_SECRET
        sync: false
